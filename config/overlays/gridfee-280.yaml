# Overlay for the `gridfee-280` scenario, deep-merged over assumptions.yaml.
#
# One input moved and nothing else: twice the flat charge every geography carries.
#
# Part of the overnight sensitivity set. Routes are limited to the ones this
# input can reach, so a run that could not respond to it is not solved at all.
grid:
  fee_eur_per_mw_per_year: 280000
