# Overlay for the `moe-turndown-70` scenario, deep-merged over assumptions.yaml.
#
# The MOE cell's minimum load while built. The base case holds it at 0.95, which
# is near enough to "runs flat" that the cell cannot follow a price or a wind
# forecast at all; 0.70 is Boston Metal's own published turndown figure.
#
# What it buys only shows up against something that can absorb the modulation —
# here the finished-steel store, which lets production flex while the steel load
# stays flat. With the cell pinned at 0.95 the optimiser builds almost no store,
# because there is nothing to buffer.
#
# The file name is the mechanism: an overlay is found at
# config/overlays/{scenario}.yaml and nowhere else, so a scenario whose file is
# missing solves on the base values and reports a null result rather than failing.
moe:
  p_min_pu: 0.7
