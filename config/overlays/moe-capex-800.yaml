# Overlay for the `moe-capex-800` scenario, deep-merged over assumptions.yaml.
#
# One input moved and nothing else: MOE at the optimistic end of a pre-commercial range.
#
# Part of the overnight sensitivity set. Routes are limited to the ones this
# input can reach, so a run that could not respond to it is not solved at all.
moe:
  capex_per_t_per_year_eur: 800
