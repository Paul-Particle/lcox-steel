# Overlay for the `batt-capex-40` scenario, deep-merged over assumptions.yaml.
#
# One input moved and nothing else: battery energy capacity at well under half today's.
#
# Part of the overnight sensitivity set. Routes are limited to the ones this
# input can reach, so a run that could not respond to it is not solved at all.
battery:
  capex_per_mwh_eur: 40000
