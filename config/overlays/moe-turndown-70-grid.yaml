# Overlay for the `moe-turndown-70-grid` scenario, deep-merged over assumptions.yaml.
#
# The grid-connected twin of `moe-turndown-70`: the same 0.70 minimum load on the
# MOE cell, Boston Metal's own published turndown figure, against the base case's
# 0.95 — near enough to "runs flat" that the cell cannot follow a price at all.
#
# Islanded, the 0.70 cell saved 55-131 EUR/t while the finished-steel store stayed
# essentially unbuilt, so what it bought there was following the resource and
# cutting renewable overbuild rather than time-shifting through a store. On grid
# the flexibility is worth something different again — the cell can follow an
# hourly price instead of the weather — which is what this scenario measures.
#
# The file name is the mechanism: an overlay is found at
# config/assumptions_{scenario}.yaml and nowhere else, so a scenario whose file is
# missing solves on the base values and reports a null result rather than failing.
moe:
  p_min_pu: 0.7
