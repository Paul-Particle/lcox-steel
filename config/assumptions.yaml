finance:
  default_wacc: 0.07

# Everything in this file is a default. A per-scenario
# `config/overlays/{scenario}.yaml` overlay is deep-merged on top of it and
# is the only thing that overrides these values; nothing sits beneath them.
#
# Routes are not selected here. One solve builds exactly one route, taken from
# the `route` column of config/scenarios.csv and named by the `{route}`
# wildcard. The implemented route ids live in workflow/common/_runs.py.

plant:
  dri_mt_per_year: 0.526  # 100 MW H2 LHV input × 8760 h / 33.33 kWh/kg / 50 kg/t
  h2_intensity_kg_per_t_dri: 50.0
  # Floor for electrolyser sizing — the optimiser may grow it further when the
  # extra capacity earns its capex via buffer-mediated arbitrage of cheap RES.
  # Used by the h2_only route only; steel routes size the electrolyser freely
  # from the steel chain's demand.
  availability_target: 0.95
  # Demand anchor for the steel routes: a flat t/h load on the steel bus
  # (supply-side model; steel demand itself is not flexible).
  steel_mt_per_year: 1.0

# The register's global IRENA 2025 figures. One set for every geography, as with
# the other cross-country inputs in this file.
res:
  wind-onshore:
    capex_per_mw_eur: 864_000
    opex_per_mw_per_year_eur: 21_600
    lifetime_years: 20
  solar:
    capex_per_mw_eur: 590_000
    opex_per_mw_per_year_eur: 11_800
    lifetime_years: 20
  wind-offshore:
    capex_per_mw_eur: 2_594_000
    opex_per_mw_per_year_eur: 64_800
    lifetime_years: 20

electrolyser:
  # Alkaline. The register carries alkaline and PEM side by side throughout; this
  # run is priced on the alkaline column.
  capex_per_mw_eur: 928_000
  opex_per_mw_per_year_eur: 18_600   # 2 % of capex
  lifetime_years: 30
  efficiency_kwh_per_kg: 48.3
  # Variable opex per MWh electricity input (water, consumables); applied as
  # marginal_cost on the link's p0 side.
  varopex_eur_per_mwh_el: 1.0

battery:
  # Duration is not set here: energy and power capacity are priced separately
  # and sized separately, so the optimiser picks the hours. capex_per_mw_eur
  # buys one bidirectional inverter, charging and discharging at that rating.
  capex_per_mw_eur: 138_000   # power capacity cost
  capex_per_mwh_eur: 89_600   # energy capacity cost
  lifetime_years: 20
  efficiency_roundtrip: 0.85

h2_buffer:
  # Salt cavern, the storage every route is given by default here — a lower
  # bound, and deliberately so. The register's tank-with-compressor figure is
  # 60_050 EUR/MWh; set that to price the routes on tanks instead.
  capex_per_mwh_eur: 350
  lifetime_years: 30
  # e_nom_extendable always True — PyPSA finds optimal buffer size

# ---------------------------------------------------------------------------
# Steel-route process steps. Capex is quoted per tonne of annual output
# capacity (€/(t/yr), the standard industry quote); fixed opex likewise per
# t/yr (≈3 % of capex). p_min_pu is the minimum turndown while built —
# capacity can never run below that fraction of p_nom (candidates for
# sweeping later). Ore enters as a variable cost per tonne of iron/steel
# output; no ore bus. All numbers are order-of-magnitude eyeballs to be
# reviewed — sources noted per section.
# ---------------------------------------------------------------------------

dri-h2:
  # H2 DRI shaft furnace, per tonne of annual DRI output. A greenfield,
  # equipment-level figure: taken with the EAF's it puts the whole DR-EAF route
  # near 780 €/(t steel/yr), which is the range built and announced projects sit
  # in — Thyssenkrupp's 2.5 Mt/yr Duisburg plant at ~€2 bn is ~800 €/(t/yr)
  # including its melters. Agora apply a further 1.8x for brownfield integration.
  capex_per_t_per_year_eur: 566
  # All-in fixed operating cost: labour, maintenance and overhead, which is why
  # it is an eighth of capex rather than the few per cent a maintenance-only
  # figure would be. The mean of the register's Australian, Brazilian and
  # European figures, one value being all this file can hold.
  opex_per_t_per_year_eur: 70
  lifetime_years: 20
  el_mwh_per_t: 1.006                 # 177 kWh/t auxiliaries + 828 kWh/t electric heat
  ore_eur_per_t: 238                  # DR-grade pellets, per t of DRI
  iron_t_per_t_steel: 1.17            # DR pellets: gangue plus metallisation loss
  p_min_pu: 0.5

dri-mix:
  # One shaft reducing with whatever blend of H2 and natural gas it is fed —
  # not two furnaces side by side. A Midrex-type shaft takes a blended
  # reductant gas, so the route buys one furnace and the optimiser picks the
  # mix, instead of paying capex twice for the option to switch.
  #
  # Both single-fuel shafts sit at the same 295 €2022/(t DRI/yr), so a
  # dual-capable one is taken at that level too. See dri-h2 for where the
  # figure comes from and why it is not the familiar 230.
  capex_per_t_per_year_eur: 566
  opex_per_t_per_year_eur: 70
  lifetime_years: 20
  # Shaft auxiliaries alone, as the NG shaft. The H2 feed's preheat is charged
  # where it belongs, on the H2 side, and the register splits the H2 shaft the
  # same way: 178 kWh/t of machine drive plus 828 kWh/t of electric heat is the
  # single-fuel H2 shaft's 1.006, so the blend's corners meet the routes it sits
  # between.
  el_mwh_per_t: 0.178
  h2_preheat_el_mwh_per_t: 0.828
  ore_eur_per_t: 238                  # DR-grade pellets, as the other shafts
  iron_t_per_t_steel: 1.17
  p_min_pu: 0.5
  # A small buffer on the reductant bus, fixed rather than sized by the
  # optimiser, so the shaft draws from a mixed volume instead of straight off
  # whichever feed is cheapest that hour. Measured in hours of the plant's
  # nominal reductant draw. It is not what makes the blend worth having — the
  # shared furnace is — so keep it small enough to stay a smoothing buffer.
  reductant_store_hours: 4

eaf:
  # Shared by every route that melts iron. Capex is the same furnace whatever
  # arrives in it — a full EAF, including for moe-eaf: the cell pours iron, not
  # steel, and the refining, alloying and superheating still have to happen
  # somewhere. Hannah's cheap-ladle case is that same furnace with the capex
  # written down by a scenario overlay, e.g.
  #   eaf: {capex_per_t_per_year_eur: 50, opex_per_t_per_year_eur: 1.5}
  # Per tonne of annual liquid steel, which is the basis an EAF is quoted on.
  capex_per_t_per_year_eur: 363
  # As the shaft's: all-in, labour and overhead included, and the mean of the
  # register's three regions.
  opex_per_t_per_year_eur: 91
  lifetime_years: 20
  consumables_eur_per_t: 40           # electrodes, fluxes, alloys, carbon; per t steel

  # Electricity by how hot the iron arrives (common._runs.EAF_CHARGE says which
  # state a route delivers). Melting is nearly all of an EAF's electricity, so
  # iron that shows up hot has had part of that bill paid upstream.
  charge:
    briquettes:
      # 25 °C HBI off a ship. The register's dearest charge: briquettes are
      # dense, and they arrive with the gangue the shaft could not take out.
      el_mwh_per_t: 0.569
    plates:
      # 25 °C electrowon plates, or MOE iron let go cold and solid. Cold like
      # the briquettes, but nearly gangue-free, so less of the melt is spent on
      # material that ends up in the slag.
      el_mwh_per_t: 0.450
    hot:
      # ~650 °C: sponge iron walked straight from the shaft to the furnace.
      el_mwh_per_t: 0.447
    liquid:
      # ~1550 °C from the MOE cell, so the melt is already done. What is left
      # covers getting the metal across to the furnace, the heat it loses on the
      # way, holding the bath and superheating to tapping temperature.
      el_mwh_per_t: 0.183

moe:
  # Molten oxide electrolysis (Boston Metal type), electricity → liquid iron.
  # ~4 MWh/t and ~$1000/(t/yr) per Boston Metal's public estimates; capex
  # highly uncertain (pre-commercial). The cell can barely turn down (freeze
  # risk), hence p_min_pu near 1. Output is hot metal, so there is no store on
  # the iron bus: the cell feeds the EAF directly, hour for hour.
  capex_per_t_per_year_eur: 1416
  # The register gives the shaft, the MOE cell and the electrowinning cell one
  # fixed-operating-cost row between them, so all three carry the same figure.
  opex_per_t_per_year_eur: 70
  lifetime_years: 20
  el_mwh_per_t: 3.181                 # per t liquid iron, mid ore grade
  # Concentrate rather than DR-grade pellets, which is most of why it is cheaper
  # per tonne of iron than the shaft's: 1.54 t at the register's iron-ore fines
  # price, against 1.38 t of pellets carrying a DR premium.
  ore_eur_per_t: 159
  # The cell is its own slag channel: gangue stays ionic in the electrolyte and
  # leaves as a bleed, so what reaches the furnace is carbon-free, silicon-free
  # iron. That is the whole difference from hot metal, which takes about 1.08 a
  # tonne because 4 % carbon and a point of silicon burn out of it. Here the only
  # losses are transfer and ladle skull and a little refining oxidation.
  #
  # Ore grade therefore does not move this number — it moves `ore_eur_per_t` and
  # the cell's throughput. Phosphorus is the one impurity that could reach the
  # furnace and force a dephosphorising slag, which would cost about two points.
  iron_t_per_t_steel: 1.03
  p_min_pu: 0.95

ew:
  # Low-temperature aqueous iron electrowinning (Electra type), electricity →
  # solid iron plates. ~2–3 MWh/t iron claimed; capex very uncertain
  # (500–3000 €/(t/yr) span in public estimates — sweep this).
  capex_per_t_per_year_eur: 708
  opex_per_t_per_year_eur: 70         # shares the register's row with DRI and MOE
  lifetime_years: 20
  el_mwh_per_t: 3.739                 # per t iron plate, excluding ore prep
  # The same concentrate the MOE cell takes, at the same price.
  ore_eur_per_t: 159
  # Plates are above 99 % iron — the gangue is refined out of the leach liquor
  # rather than slagged off downstream — so there is almost none to lose to slag.
  # A point above the MOE cell's because the plate arrives cold and solid and
  # pays a melt-in oxidation and dust penalty that liquid iron never does.
  iron_t_per_t_steel: 1.04
  p_min_pu: 0.2                       # marketed as load-following

natural_gas:
  # Flat gas price for the fossil routes, €/MWh LHV. Fed to the gas_supply
  # generator. One value for every geography: the per-country prices this used
  # to carry (25-42) lived in a per-scenario overlay each, because there is no
  # per-area assumptions mechanism yet. A single price also keeps the fossil
  # benchmark comparable across countries, the same argument that governs the
  # other cross-country inputs.
  price_eur_per_mwh: 21.9       # midpoint of the register's low/high benchmark
  # Its emissions and the optional carbon price on them are under `emissions`.

dri-ng:
  # Natural-gas DRI shaft (Midrex/HYL type) — the mature fossil benchmark.
  # Same shaft capex level as the H2 shaft (see dri-h2 for the source); gas use
  # ~10 GJ/t DRI. Electricity is lower than the H2 shaft (no H2 preheat).
  capex_per_t_per_year_eur: 566
  opex_per_t_per_year_eur: 70
  lifetime_years: 20
  gas_mwh_per_t: 3.469                # LHV, per t DRI: reductant plus heat
  el_mwh_per_t: 0.178                 # machine drive and auxiliaries
  ore_eur_per_t: 238                  # DR-grade pellets, same as H2 DRI
  iron_t_per_t_steel: 1.17            # same pellets as the H2 shaft, same yield
  p_min_pu: 0.5

briquetting:
  # Hot briquetting presses sponge iron leaving the shaft at ~700 °C into dense
  # briquettes (HBI) that will keep. Un-briquetted DRI re-oxidises and will not
  # travel, which is why only the export routes build one. The press itself is
  # mechanical and cheap to run; what the route really pays for this step is
  # downstream, where the briquettes reach the furnace cold.
  capex_per_t_per_year_eur: 40
  opex_per_t_per_year_eur: 1.2        # ≈3 % of capex
  lifetime_years: 20
  el_mwh_per_t: 0.01                  # press, screening and handling
  yield_t_per_t: 0.98                 # fines lost on screening

iron_store:
  # Stockpile of cold solid iron — electrowon plates for ew-eaf, briquettes for
  # an export route waiting on a ship (shed + handling). Routes that hand the
  # furnace hot metal or hot sponge iron have nowhere to put it and get none.
  # Cheap but deliberately non-zero so the optimal size is unique and reportable.
  capex_per_t_eur: 21
  lifetime_years: 100

steel_store:
  # Finished-steel inventory buffer on the steel bus. The supply-side way to
  # represent periodic (not hour-by-hour) demand: production flexes to build
  # stock while the flat steel load draws it down, so the plant decouples
  # hourly production from steady delivery by carrying inventory — the demand
  # itself stays fixed. Capped to a realistic inventory horizon (`max_weeks`)
  # so the flexibility can't degenerate into whole-year arbitrage. Covered
  # yard + handling for solid product (slabs/billets), a bit above the iron
  # stockpile; the cap, not the cost, is the binding limit.
  capex_per_t_eur: 30
  lifetime_years: 25
  max_weeks: 8   # inventory cap = 8 weeks of flat production

grid:
  # Grid connection charges for the grid_import generator: the connection is
  # sized by the optimiser (extendable) and pays annuitised connection capex
  # plus a yearly capacity fee per MW; energy drawn pays the day-ahead price
  # plus a volumetric fee. German HV-level order-of-magnitude eyeballs.
  connection_capex_eur_per_mw: 150_000
  connection_lifetime_years: 40
  # One capacity charge and no volumetric one, so every geography is compared on
  # the same single number. At this plant's ~8000 full-load hours it works out
  # near 19 €/MWh, between the German HV band-load position and Hydrogen
  # Europe's 29.3 €/MWh EU average.
  fee_eur_per_mw_per_year: 140_000
  fee_eur_per_mwh: 0.0

destination:
  # Where an `-export` route melts its iron: an area from config.yaml's `areas`
  # registry that trades in a wholesale market. The furnace there is priced and
  # counted against that market's own hourly series — the same download every
  # grid run uses, at `variant: emissions`, so its price and its generation mix
  # come from one file. Nothing about the destination is a hand-set number any
  # more; changing this line changes both the bill and the carbon.
  #
  # Connection charges come from the `grid` block, which carries one set of
  # figures for every area.
  #
  # `transport.distance_km` below is keyed by the *producing* country alone, so
  # its legs have to be drawn to whichever destination this names — they are
  # drawn to Spain. Moving this line means redrawing them; re-keying the legs by
  # (origin, destination) is the change that would make the pair travel together.
  area: ESP

transport:
  # Freight, charged per t and km with no capacity decision and no capex,
  # because ships and wagons are chartered rather than built.
  #
  # Distances are an assumption and not geography, which is why they live here
  # and not in the area registry — they depend on the destination port and on
  # the routing (Suez or the Cape), and we expect to vary both.
  #
  # deliver_finished_steel decides where the model stops. Off (the default) it
  # stops at the plant gate, and only an export route pays freight — it has to,
  # because its furnace is somewhere else. On, every route also delivers its
  # steel to the destination over the same legs, which is the comparison the
  # export routes exist for: ship 1.1 t of iron, or ship 1 t of steel. An
  # export route pays no steel freight either way; its steel is already there.
  deliver_finished_steel: false

  # Two parts per leg: a charge per t that does not care how far the cargo
  # goes (port dues, loading, discharge) and a charge per t and km that does.
  # Published ore rates only make sense that way — Western Australia to
  # Qingdao is a third of the distance of Tubarao to Qingdao but costs almost
  # half as much, which no single per-km rate reproduces. Fitting the two
  # gives about $4/t plus $0.0010/t·km, and that is what the sea numbers are
  # anchored on.
  #
  # Iron carries a premium over ore for handling: DRI and HBI re-oxidise, so
  # they travel in fitted holds under inert gas. Steel is dearer again — coil
  # and plate go breakbulk, which stows worse and handles slower than bulk.
  # Rail is an order of magnitude dearer per t·km than sea, which is the whole
  # reason iron moves between continents by ship and barely moves overland;
  # its per-t part is zero because the European rates we anchor on are already
  # quoted all-in.
  sea:
    iron:  { eur_per_t: 0,  eur_per_t_km: 0.000343 }
    steel: { eur_per_t: 0,  eur_per_t_km: 0.000343 }
  rail:
    iron:  { eur_per_t: 0,  eur_per_t_km: 0.035 }
    steel: { eur_per_t: 0,  eur_per_t_km: 0.045 }

  # Legs from the producing country to the destination, by mode. An EU producer
  # has no sea leg, only a token overland run to the furnace.
  # Legs from the producing country to Spain, by mode. The sea distances are the
  # register's; the overland ones are road-and-rail distances to the Spanish
  # coast. Alberta is landlocked, so its iron goes to Vancouver before it floats;
  # Ontario reaches the Atlantic down the St. Lawrence.
  distance_km:
    DEU: { rail: 1_800 }
    FRA: { rail: 1_000 }
    ESP: { rail: 400 }
    BRA: { sea: 8_945 }                    # register: Brazil -> Spain
    AUS: { sea: 17_960 }                   # register: Australia -> Spain
    AB:  { rail: 1_150, sea: 15_400 }      # Edmonton -> Vancouver -> Spain via Panama
    ONT: { rail: 550, sea: 5_900 }         # Hamilton -> Montreal -> Spain

anchor:
  # Anchor-colocation scenarios only (the `anchor-colo-n*` CF variants). The
  # anchor cell is the plant site, and every site is an extendable generator, so
  # without a floor the optimiser may build nothing there — leaving the anchor as
  # the thing that shortlisted the candidates rather than a place anything
  # stands. 0 leaves that freedom, which is what every run before this had.
  min_capacity_mw: 0

transmission:
  # HVDC link connecting a candidate RES site to the electrolyser/demand site.
  # Only used by multi-site scenarios (those with a config/sites_{project}_{scenario}.yaml
  # overlay, or anchor-colo-n* CF inputs where the anchor cell is the demand
  # site); single-site scenarios never add a transmission link.
  cost_per_mw_per_km_eur: 400   # HVDC overhead, order-of-magnitude (PyPSA-Eur-ish)
  lifetime_years: 40
  losses_pct_per_1000km: 3.0    # ~3% / 1000 km, applied as link efficiency
  indirect_route_factor: 1.25   # great-circle distance → routed cable length

emissions:
  # What the run's energy and freight put into the air. Accounting only, apart
  # from the carbon price below: none of the rest reaches the objective, so it
  # never changes a solve.
  #
  # WHAT IS NOT COUNTED. The model's boundary stops where the melt does (see
  # build_network's module docstring), so the direct emissions of the process
  # steps themselves are absent: EAF electrode consumption and carbon
  # injection, the carbon in DR-grade pellets, carbonate fluxes, and the
  # carburiser. Those are the ones the EU ETS and CBAM actually charge for, so
  # a figure from here is not a CBAM or ETS number and must not be read as
  # one. What is counted is the energy and the freight: grid and renewable
  # electricity, natural gas combustion, and the ships and trains.
  #
  # Which set of grid emission factors below a run uses. Reports carry its name
  # so a number cannot be read on the wrong one.
  basis: default_grid_emission_factors

  default_grid_emission_factors:
    # t CO2e per MWh of electricity generated: what comes out of the stack, and
    # nothing else, so renewables and nuclear are zero. This is what a grid CO2
    # monitor reports and what most "grid carbon intensity" figures mean.
    # Agora Energiewende's Agorameter factors. The 1.57 shared by the dirty
    # catch-alls is deliberately punitive: they are small, mixed, and mostly
    # worse than lignite.
    #
    # Keyed by the carrier names the grid pipeline uses (see
    # grid/download_entsoe.py and grid/download_nem.py, which were deliberately
    # given one shared vocabulary — the same keys serve both markets). These
    # keys are what a `variant: emissions` grid series has columns for, which is
    # how the two meet. A carrier appearing in a generation series but missing
    # here is an error, not a zero.
    #
    # Storage carriers are here for the vocabulary rather than for their factor:
    # the report leaves them out of a mix altogether, both what a reservoir gives
    # back and what it took to fill it, which is what makes stored energy carry
    # the average of everything else. Counting the discharge at a factor of zero
    # would instead read as free power and dilute the mix (a couple of per cent
    # in DE, more in a hydro-heavy NEM region). Their round-trip loss is charged
    # where it belongs, as extra electricity drawn.
    electricity_t_co2e_per_mwh:
      biomass:         0
      brown_coal:      1.12
      coal_gas:        1.57
      energy_storage:  0
      gas:             0.38
      geothermal:      0
      hard_coal:       0.82
      hydro:           0        # NEM's undivided hydro
      hydro_reservoir: 0
      hydro_river:     0
      marine:          0
      nuclear:         0
      oil:             1.57
      oil_shale:       1.57
      other:           1.57
      other_re:        0
      peat:            1.57
      pumped_storage:  0
      solar:           0
      waste:           1.57
      wind_offshore:   0
      wind_onshore:    0

  # There is deliberately no per-area annual figure here, and none for the
  # destination either. Every intensity in the model comes from a generation
  # series — `variant: emissions`, which every grid row in config/scenarios.csv
  # asks for, and which an `-export` route also pulls for the market its furnace
  # stands in — weighted by the table above. A run whose series carries no mix
  # is a mistake in the scenario table, not a case to paper over, so the report
  # says so and stops.

  # Natural gas burned in a shaft, t CO2e per MWh LHV. Direct emissions, not
  # scope 2 like the grid factors above: they give the NG-DRI comparison case an
  # emissions figure, as a baseline for the scope 2 emissions of runs on a dirty
  # grid. `process` is combustion; `upstream` is the fuel's own supply chain —
  # extraction, processing, pipelines, and the methane that leaks on the way —
  # zero for now, and kept in case we decide to count it.
  natural_gas_reductant_t_co2e_per_mwh:
    process:  0.20
    upstream: 0

  # € per t CO2e on the natural gas `process` emissions, added to the gas
  # price. The default carbon price is zero and it's just kept here for option
  # value; it does influence the run if it is set though. For scale, the EU ETS
  # 2023 average was about 85 €/t.
  co2_price_eur_per_t: 0

  # Freight, kg CO2e per t of cargo and km travelled. Diagnostic only for now:
  # only the diagnostic report carries freight emissions. Sea is a capesize bulk
  # carrier; scale up by about half for panamax parcels, which are dearer per
  # t*km. Rail is European electric traction — note that its emissions are
  # already inside whatever grid the railway buys from, so this is a footprint
  # number and not an additional cost.
  #
  # Source: GLEC Framework v3.2, which is well-to-wake (bulk >200k dwt 3.1,
  # 60-100k dwt 5.2; rail electric 10.8, diesel 30.7 gCO2e/t*km). Capesize
  # interpolates to ~3.5. These figures drop the fuel's own supply chain, about
  # 15 % of a ship's well-to-wake; for electric rail they are the generation
  # behind the wire, which is a stack emission and stays.
  freight_kg_co2e_per_t_km:
    sea:  0.0030
    rail: 0.0108
