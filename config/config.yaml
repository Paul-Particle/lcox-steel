logging:
  # Root level for the project's own loggers. Set to DEBUG for verbose runs.
  # Override on the CLI: snakemake --config 'logging={level: DEBUG}'.
  level: INFO
  # Level for noisy upstream libraries (atlite, cdsapi, pypsa, ...).
  third_party_level: WARNING
  # %()s is logging.Formatter's own template syntax — unrelated to the
  # "f-strings ok in log calls" convention (that's about call sites).
  format: "%(asctime)s | %(levelname)-7s | %(name)s | %(message)s"

# Scenarios the default `snakemake` target (rule demo) builds. sensitivity-test
# is the one that needs no CDS download — it sits on the shipped VIC1 cutout —
# so it doubles as the after-a-fresh-clone smoke test. Listed by name
# rather than matched on one, because a scenario name is a free-form label: the
# workflow never reads meaning out of it, so any string works as an id.
demo_scenarios:
  - sensitivity-test

entsoe:
  # Per-(area, data_type) downloads are pulled on demand by config/scenarios.csv;
  # the bidding-zone catalog lives in data/entsoe_cache/entsoe_bidding_zones.csv.
  data_types: [prices, load_forecast, load_actual, res, generation, crossborder]

nem:
  # FX rate for converting AUD-denominated NEM prices to EUR (used by
  # grid.smk → retrieve_grid_data). Infra-level constant; per-scenario cost
  # assumptions live in config/assumptions*.yaml.
  eur_per_aud: 0.61

canada:
  # FX rate for converting CAD-denominated AESO and IESO prices to EUR (used by
  # grid.smk → retrieve_grid_data). Same standing as eur_per_aud above: an
  # infra-level constant, not a researched figure.
  eur_per_cad: 0.64

ons:
  # Brazil (SIN). Areas are the four submarkets: SE, S, NE, N.
  # FX rate for converting BRL-denominated prices to EUR, as for nem above.
  eur_per_brl: 0.167

  # ANEEL sets a PLD floor and cap each year (IPCA-indexed); retrieve_ons uses
  # them to reconstruct PLD from the CMO that ONS publishes. `max_hourly` is the
  # cap that binds an hourly price — `max_structural` caps the *weekly average*
  # and is recorded here for reference only, not applied.
  # Sources: ANEEL Despacho 3.850/2025 (2026) and the equivalent year-end
  # despachos for 2024 and 2025. Add a year here before requesting it.
  pld_limits:
    2024: { min:  61.07, max_hourly: 1470.57, max_structural: 716.80 }
    2025: { min:  58.60, max_hourly: 1542.23, max_structural: 751.73 }
    2026: { min:  57.31, max_hourly: 1611.04, max_structural: 785.27 }

# Reporting. best_zone_by names the field that decides which of a country's
# zones represents it — a country supplying its market through zones is run once
# per zone, and only the cheapest reaches results/report_{scenario}.csv. The
# beaten zones are not lost: they go to the hidden diagnostic beside it, with the
# `best_in_country` flag that separates them. `lco_output` is the levelised cost
# of whatever the run produces (steel, or hydrogen for h2-only). Null reports
# every zone, i.e. no ranking.
report:
  best_zone_by: lco_output

# The area registry. `area` in config/scenarios.csv names one of these keys, and
# each key names one cutout. An area is a country (three-letter ISO 3166-1
# alpha-3) or a sub-national market zone; nothing infers which from the shape of
# the code, it follows from the entries below.
#   iso3:           3-letter code for Natural Earth ADM0_A3 lookup
#   region:         tag stored in the geo parquet (mostly ISO-2, but AUS/BRA
#                   stayed ISO-3 historically — kept that way to avoid
#                   regenerating the geometry and chasing downstream)
#   market:         which wholesale market this area trades in, `entsoe` or
#                   `nem`; absent where no price series exists.
#   market_area:    the code that market knows this area by — the ENTSO-E
#                   bidding zone or AEMO NEM region. Also an alias: writing it
#                   in the CSV resolves to this area, so DE_LU and DEU both work.
#   zones:          sub-national market zones. A country with no market of its
#                   own supplies one only through these, so a grid scenario
#                   naming the country runs its zones separately instead.
#   coarse:         use a coarser cutout resolution to avoid CDS instability
#                   / memory limits for large countries
#   mainland_bbox:  optional [lon_min, lon_max, lat_min, lat_max] — keeps only
#                   polygon parts whose centroid falls inside the box. Used
#                   to drop overseas territories (e.g. metropolitan France).
#   cutout_bbox:    optional [lon_min, lon_max, lat_min, lat_max] — the cutout
#                   request's bounds, in place of the land ∪ offshore box
#                   padded by `res_cf.cutout.bbox_pad_deg`.
#   demo:           true for the no-download demo's own area, which
#                   `all-areas` leaves out.
#
# Sub-national areas (the NEM regions) do not get their geometry from the
# workflow. make_area_geometry reads Natural Earth Admin 0 — countries only —
# and its mainland_bbox drops whole polygon parts by centroid rather than
# cutting one, so it cannot make a state: pointed at VIC1 (iso3: AUS) it would
# return the whole of Australia labelled VIC. Their geometries are instead cut
# from Natural Earth Admin 1 by hand and committed past .gitignore as
# resources/shapes/{area}_geo.parquet — within 0.2% of the ABS state areas.
# Delete one and the rule cannot replace it — make_area_geometry refuses to run
# for an area that is someone's zone rather than quietly building the country.
# Issue #64 covers reading Admin 1 in the pipeline instead.
areas:
  DEU:   { iso3: DEU, region: DE,  coarse: false, market: entsoe, market_area: DE_LU }
  FRA:   { iso3: FRA, region: FR,  coarse: false, market: entsoe, market_area: FR, mainland_bbox: [-10, 15, 41, 52] }
  ESP:   { iso3: ESP, region: ES,  coarse: false, market: entsoe, market_area: ES }
  # No market of its own: a grid scenario naming AUS runs its zones instead.
  AUS:   { iso3: AUS, region: AUS, coarse: false, zones: [NSW1, QLD1, SA1, TAS1, VIC1] }
  # The SIN is one grid split into four price zones, so a grid scenario naming
  # BRA runs the submarkets and an islanded one keeps the country whole. Their
  # geometries are cut from Natural Earth Admin 1 by scratch/cut_brazil_submarkets.py
  # (the mapping is electrical, not geographic — Acre and Rondonia are SE/CO, and
  # Maranhao is N). Each takes the whole-Brazil cutout rather than a slice: a
  # submarket's cells are a subset of the national grid, and the CF scripts select
  # by geometry, not by the cutout's extent.
  #
  # Every market_area here is quoted. YAML 1.1 reads a bare N as boolean false,
  # the same trap that made Ontario's key ONT.
  BRA:   { iso3: BRA, region: BRA, coarse: false, zones: [BR_SE, BR_S, BR_NE, BR_N] }
  BR_SE: { iso3: BRA, region: BR_SE, coarse: false, market: ons, market_area: "SE" }
  BR_S:  { iso3: BRA, region: BR_S,  coarse: false, market: ons, market_area: "S" }
  BR_NE: { iso3: BRA, region: BR_NE, coarse: false, market: ons, market_area: "NE" }
  BR_N:  { iso3: BRA, region: BR_N,  coarse: false, market: ons, market_area: "N" }
  # Alberta and Ontario are the only Canadian provinces with a wholesale market;
  # the rest are regulated cost-of-service utilities with no hourly price. They
  # are top-level areas rather than zones of a CAN entry because `all-areas`
  # starts from the areas that are nobody's zone: under a CAN parent they would be
  # unreachable islanded, and CAN itself has no cutout — Canada is 63,000 ERA5
  # cells and a multi-hour download. Nothing ranks the two against each other as a
  # result, which the NEM zones do get; they are reported side by side.
  #
  # Ontario is ONT, not the province's usual ON, because YAML 1.1 reads a bare ON
  # as boolean true — as the key it would become True, and as a market_area it
  # would reach a filename as "True" without erroring.
  AB:    { iso3: CAN, region: AB,  coarse: false, market: aeso, market_area: AB }
  # Ontario's HOEP series ends at 2025-04-30 23:00, where the Market Renewal
  # Program replaced it with locational marginal prices that nothing here reads.
  # `market_until` is what keeps ONT out of a grid scenario reaching past that
  # date — `all-areas` drops it from the 2025 run and keeps it in a 2024 one,
  # instead of the retrieve rule failing eight months short.
  #
  # HOEP is also a commodity-only price and leaves out the Global Adjustment,
  # which is most of what an Ontario consumer actually pays — 2024 averages 20.6
  # EUR/MWh against nearly a hundred in Germany, and that gap is the missing
  # charge, not cheap power. So an Ontario LCOS computed from it is a wholesale
  # energy component and never a delivered cost, and does not belong in a
  # ranking against the all-in prices every other area carries. Adding a GA term
  # is what would make it comparable.
  ONT:   { iso3: CAN, region: "ON", coarse: false, market: ieso, market_area: ONT,
           market_until: "20250430" }
  # The NEM regions. AEMO serves prices for all five; each costs a CDS download
  # the first time it is solved.
  VIC1:  { iso3: AUS, region: VIC, coarse: false, market: nem, market_area: VIC1 }
  NSW1:  { iso3: AUS, region: NSW, coarse: false, market: nem, market_area: NSW1 }
  QLD1:  { iso3: AUS, region: QLD, coarse: false, market: nem, market_area: QLD1 }
  SA1:   { iso3: AUS, region: SA,  coarse: false, market: nem, market_area: SA1 }
  TAS1:  { iso3: AUS, region: TAS, coarse: false, market: nem, market_area: TAS1 }

  # The demo's area: Victoria at 0.5°, over exactly the box of the cutout that
  # ships in cutouts/DEMO_20250101_20251231_backup.nc, so the default `snakemake`
  # run needs no CDS download and no EEZ/NE zips. Its geometries are VIC1's,
  # committed as resources/shapes/DEMO_geo.parquet and DEMO_offshore_geo.parquet;
  # being a demo area, the geometry rules never rebuild them.
  DEMO:  { iso3: AUS, region: VIC, coarse: true, cutout_bbox: [141.0, 149.5, -39.0, -34.0],
           demo: true }

res_cf:
  offshore_max_distance_km: 200

  # Atlite cutout build settings.
  # bbox_pad_deg            degrees of padding added around country/region bounds.
  # monthly_requests        split CDS download into one request per month; reduces
  #                         individual request size but multiplies queue wait times
  #                         (6000+ jobs in the global queue is common — use sparingly).
  cutout:
    bbox_pad_deg: 1.0
    monthly_requests: false
    # Seconds between CDS job-status *polls* while a download waits in the queue
    # (common._cds_monitor). The log only prints on a status change plus a
    # periodic "still working" heartbeat, so this controls how promptly changes
    # are noticed, not log volume. Purely cosmetic — does not affect the download.
    cds_poll_interval_s: 60
    # Warn (never prune) when the keyed cutout cache exceeds this size, and warn
    # when free disk before a download drops below the floor. 0 disables either.
    cache_warn_size_gb: 100
    min_free_disk_gb: 20

  # atlite technology settings (passed to cutout.wind / cutout.pv).
  # Onshore is a placeholder until the turbine work lands — moved off a 2010
  # 3 MW model so test runs are not built on fifteen-year-old wind.
  wind_onshore_turbine:  NREL_ReferenceTurbine_2020ATB_4MW
  wind_offshore_turbine: NREL_ReferenceTurbine_5MW_offshore
  # A Huld-2010 fit of relative performance against irradiance and module
  # temperature, not a module. atlite ships three panels — this, CdTe, and one
  # 2006 amorphous Kaneka module — so there is nothing newer to move to, and the
  # `efficiency: 0.1` in the file is inert: the conversion returns kWh per kWp,
  # so module efficiency changes the area a MW needs and not the capacity factor.
  # What is dated is the temperature coefficient the fit implies, -0.47 %/K
  # against about -0.30 %/K for a current TOPCon module. That is worth roughly
  # +1.6 % of annual CF in Germany and +5.8 % in tropical Brazil, so it matters
  # most exactly where the model is comparing geographies.
  pv_panel:              CSi
  # Within 0.25 % of the best fixed tilt in every area tested, so the rule of
  # thumb is not what limits solar CF here.
  pv_orientation:        latitude_optimal

  # Wind CF computation flags — passed to atlite.Cutout.wind() in
  # d1_area_average, d2_bestsite_p95 (and d3 through it), d5_multi.
  # smooth                  atlite's smoothed power curve. Its parameters are a fit
  #                         to Danish feed-in data (Andresen et al. 2015), so it acts
  #                         as one country's correction applied to every area; off.
  # add_cutout_windspeed    preserves atlite's built-in 25 m/s cutoff during smoothing
  wind_cf:
    smooth: false
    add_cutout_windspeed: true

  # Land-sea eligibility for ONSHORE CF (issue #41). Coarse ERA5 coastal cells
  # blend sea + land and inflate onshore wind CF. Cells whose land fraction is
  # below `min_land_fraction` of the region's max are dropped from onshore
  # weighting/selection: d1's area mean, and d2/d3's P95 / best-site / max.
  # 0.98 reproduces the validated notebook cutoff; 0 disables the fix. Offshore
  # wind is never affected (sited on sea by design).
  #
  # eligibility_source picks where the per-cell land fraction comes from:
  #   indicatormatrix   coarse NE-110m land/sea outline, no extra data (default).
  #   availabilitymatrix finer coastline via atlite availabilitymatrix +
  #                      ExclusionContainer over a high-res land polygon. Wired and
  #                      cross-checked against indicatormatrix (agrees in 5/6 areas);
  #                      needs the ne_10m_land download (see README + the availability
  #                      block below). See cell_availability_fraction() in
  #                      res_cf/_helpers.py and docs/land_eligibility_design.md.
  eligibility_source: indicatormatrix
  min_land_fraction: 0.98

  # Settings for eligibility_source: availabilitymatrix (finer coastline via
  # atlite availabilitymatrix + ExclusionContainer over a high-res land polygon).
  # Ignored when eligibility_source is indicatormatrix.
  #   land_shapes  high-res land polygon; sea = everything outside it. Natural
  #                Earth 10m land (manual download — see README). EPSG:4326.
  #   crs          equal-area CRS (metres) the exclusion raster is built in.
  #                ExclusionContainer's default 3035 is Europe-only; 6933 is
  #                global equal-area, so it works for EU + AUS + BRA alike.
  #   res          raster resolution (metres). 200 m is ample to decide
  #                mostly-land vs mostly-sea in a ~30 km ERA5 cell and is far
  #                faster than 100 m.
  availability:
    land_shapes: data/shapes/ne_10m_land/ne_10m_land.zip
    crs: 6933
    res: 200

  # Anchor co-location for best-site RES-mix profiles (d2_bestsite_p95).
  # max_radius_km           search radius (km) for counterpart cells across techs
  # quality_floor_fraction  keep candidates with CF >= this fraction of the best nearby cell
  spatial_matching_res_mix:
    max_radius_km: 100
    quality_floor_fraction: 0.90

  #script 07b
  anchor_colocation:
    max_radius_km: 100
    n_candidates: 3
    coincidence_threshold: 0.20
    w_coincidence: 0.6
    w_correlation: 0.4

  # RES-mix scenarios needing scenario-specific co-located best-site files.
  # Each entry: {country, mix_anchor_tech, res_mix: {tech: weight, ...}} (weights sum to 1).
  # Land anchors (wind_onshore/solar) are skipped — identical to the generic anchor files;
  # offshore anchors pick a shared land counterpart weighted by res_mix. Empty = generic
  # per-tech + land-anchor files only.
  bestsite_res_mix_scenarios: []
  #   - { country: aus, mix_anchor_tech: wind_offshore, res_mix: { wind_offshore: 0.7, solar: 0.3 } }

